[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-radar"
version = "0.1.0"
description = "Daily radar of Ukrainian public IT tenders from Prozorro, published as a static site."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tender_radar*"]

[tool.setuptools.package-data]
tender_radar = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
